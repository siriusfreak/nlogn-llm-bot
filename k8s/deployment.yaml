apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlogn-llm-bot
  namespace: nlogn-llm-bot
spec:
  replicas: 1
  # One Telegram long-poller at a time: a second getUpdates loop gets 409 Conflict.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: nlogn-llm-bot
  template:
    metadata:
      labels:
        app: nlogn-llm-bot
    spec:
      nodeSelector:
        siriusfrk.me/location: berlin
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nlogn-llm-bot
          # TAG is replaced with the commit sha by `make deploy`.
          image: registry.i.siriusfrk.ru/nlogn-llm-bot:TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            # Secrets come from 1Password items tagged k8s/nlogn-llm-bot
            # (the op-tag-sync controller turns each into a Secret named after the item).
            - name: TELEGRAM_TOKEN
              valueFrom: { secretKeyRef: { name: nlogn-llm-bot-secrets, key: TELEGRAM_TOKEN } }
            - name: CONTESTER_TOKEN
              valueFrom: { secretKeyRef: { name: nlogn-llm-bot-secrets, key: CONTESTER_TOKEN } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic-api-key, key: password } }
            - name: CLAUDE_MODEL
              value: claude-sonnet-5-5
            - name: CLAUDE_EFFORT
              value: medium
            - name: RATE_LIMIT
              value: "30"
            - name: DB_HOST
              value: postgres-postgresql.postgres.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-postgresql, key: postgres-password } }
            - name: DB_NAME
              value: nlogn_llm_bot
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 768Mi
